# Checks problem reports and feature requests made with OverPass and labels them; it never closes one. The rules are in
# .github/scripts/check-report.js.
name: Check report

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: contains(github.event.issue.body, 'overpass-report:') || contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const { run } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/check-report.js`);
            await run({ github, context });
