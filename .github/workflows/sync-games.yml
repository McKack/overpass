# Keeps the site in step with profiles/: approved suggestions go in (publish-profiles.mjs), the set the app downloads is
# signed, every change updates overpass.arctim.no/games, each run links issues to their games (link-issues.mjs) and checks a share
# of the games' art and descriptions (find-covers.mjs). Once a day AreWeAntiCheatYet's list goes into profiles/ (sync-anticheat.mjs).
# Needs the repository secrets GAMES_SYNC_TOKEN, the site's SYNC_TOKEN (services/site/wrangler.toml), and
# PROFILES_SIGNING_KEY, whose public half is in the app (ProfileUpdates.swift). TGDB_KEY and SGDB_KEY are optional: without
# them, art comes from Steam and GOG only.
name: Sync games

on:
  push:
    branches: [main]
    paths: ['profiles/**', '.github/scripts/games-index.js', '.github/scripts/publish-profiles.mjs', '.github/scripts/find-covers.mjs', '.github/scripts/link-issues.mjs', 'services/site/src/profile-check.js']
  # The report relay starts this every half hour as well (its wrangler.toml): GitHub skips most scheduled runs.
  schedule:
    - cron: '7,37 * * * *'
  # The relay's runs come this way too, so like scheduled runs they send the list only when something in it changed;
  # `gh workflow run sync-games.yml -f force=true` sends it anyway (after a worker change that needs fresh fields).
  workflow_dispatch:
    inputs:
      force:
        description: Send the games list even if nothing changed
        type: boolean
        default: false

# One at a time, so two runs can't sign or push over each other.
concurrency: sync-games

permissions:
  contents: write
  issues: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: anticheat
        # Someone else's list: trouble with it mustn't stop the rest.
        continue-on-error: true
        run: node .github/scripts/sync-anticheat.mjs
      - id: publish
        run: node .github/scripts/publish-profiles.mjs
        env:
          SITE: https://overpass.arctim.no
          SYNC_TOKEN: ${{ secrets.GAMES_SYNC_TOKEN }}
          PROFILES_SIGNING_KEY: ${{ secrets.PROFILES_SIGNING_KEY }}
      - if: github.event_name == 'push' || inputs.force || steps.publish.outputs.changed == 'true' || steps.anticheat.outputs.changed == 'true'
        run: node .github/scripts/games-index.js > games.json
      - if: github.event_name == 'push' || inputs.force || steps.publish.outputs.changed == 'true' || steps.anticheat.outputs.changed == 'true'
        run: |
          curl --fail-with-body -sS -X POST https://overpass.arctim.no/api/sync \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" --data-binary @games.json
        env:
          TOKEN: ${{ secrets.GAMES_SYNC_TOKEN }}
      - name: Issues
        run: node .github/scripts/link-issues.mjs
        env:
          SITE: https://overpass.arctim.no
          SYNC_TOKEN: ${{ secrets.GAMES_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
      - name: Art
        run: node .github/scripts/find-covers.mjs
        env:
          SITE: https://overpass.arctim.no
          SYNC_TOKEN: ${{ secrets.GAMES_SYNC_TOKEN }}
          TGDB_KEY: ${{ secrets.TGDB_KEY }}
          SGDB_KEY: ${{ secrets.SGDB_KEY }}
