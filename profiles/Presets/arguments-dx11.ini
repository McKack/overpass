# Preset arguments-dx11: starts with -dx11.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-dx11` in their profile.
[Preset: arguments-dx11]
# StarRupture
steam-app = 1631270
# Tokyo Xtreme Racer
steam-app = 2634950
add-arguments = -dx11
source = Known per-game settings for Wine on macOS
