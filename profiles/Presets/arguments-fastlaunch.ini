# Preset arguments-fastlaunch: starts with -FastLaunch.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-fastlaunch` in their profile.
[Preset: arguments-fastlaunch]
# Microsoft Flight Simulator (2020) (reported on Linux, umu-protonfixes)
steam-app = 1250410
add-arguments = -FastLaunch
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
