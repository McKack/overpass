# Preset arguments-hlbootdx: starts with hlbootdx.dat.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-hlbootdx` in their profile.
[Preset: arguments-hlbootdx]
# Dune: Spice Wars (reported on Highball: starts on DirectX; its OpenGL path needs a context macOS lacks)
steam-app = 1605220
add-arguments = hlbootdx.dat
source = Community reports in Highball's open database (CC0)
