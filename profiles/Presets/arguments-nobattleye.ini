# Preset arguments-nobattleye: starts with -nobattleye.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-nobattleye` in their profile.
[Preset: arguments-nobattleye]
program = PlayGTAV.exe
add-arguments = -nobattleye
source = Known per-game settings for Wine on macOS
