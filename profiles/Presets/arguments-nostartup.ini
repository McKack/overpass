# Preset arguments-nostartup: starts with -NoStartup.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-nostartup` in their profile.
[Preset: arguments-nostartup]
# Age of Empires: Definitive Edition (reported on Linux, umu-protonfixes)
steam-app = 1017900
add-arguments = -NoStartup
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
