# Preset arguments-novsync: starts with -novsync.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-novsync` in their profile.
[Preset: arguments-novsync]
program = tomb456.exe
add-arguments = -novsync
source = Known per-game settings for Wine on macOS
