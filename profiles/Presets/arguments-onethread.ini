# Preset arguments-onethread: starts with -onethread, for a game that crashes on several threads.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-onethread` in their profile.
[Preset: arguments-onethread]
# Little Nightmares (reported on Linux, umu-protonfixes)
steam-app = 424840
add-arguments = -onethread
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
