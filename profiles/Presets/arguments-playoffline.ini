# Preset arguments-playoffline: starts with -playoffline, past an old Ubisoft launcher.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-playoffline` in their profile.
[Preset: arguments-playoffline]
# Assassin's Creed: Brotherhood (reported on Linux, umu-protonfixes)
steam-app = 48190
add-arguments = -playoffline
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
