# Preset arguments-rdevice-dx11-64bit: starts with -rdevice dx11 -64bit.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-rdevice-dx11-64bit` in their profile.
[Preset: arguments-rdevice-dx11-64bit]
# Euro Truck Simulator 2
steam-app = 227300
add-arguments = -rdevice dx11 -64bit
source = Known per-game settings for Wine on macOS
