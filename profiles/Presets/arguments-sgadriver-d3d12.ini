# Preset arguments-sgadriver-d3d12: starts with -sgadriver=d3d12.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-sgadriver-d3d12` in their profile.
[Preset: arguments-sgadriver-d3d12]
program = RDR2.exe
add-arguments = -sgadriver=d3d12
source = Known per-game settings for Wine on macOS
