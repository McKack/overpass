# Preset arguments-skip-sign-in: starts with +com_skipSignInManager 1.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-skip-sign-in` in their profile.
[Preset: arguments-skip-sign-in]
# DOOM Eternal (reported on Linux, umu-protonfixes)
steam-app = 782330
add-arguments = +com_skipSignInManager 1
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
