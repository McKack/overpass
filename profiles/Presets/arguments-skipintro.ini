# Preset arguments-skipintro: starts with SKIPINTRO.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-skipintro` in their profile.
[Preset: arguments-skipintro]
# Age of Empires II (2013) (reported on Highball: closes at the intro movie without it)
steam-app = 221380
add-arguments = SKIPINTRO
source = Community reports in Highball's open database (CC0)
