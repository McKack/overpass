# Preset arguments-slash-dx11: starts with /dx11.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-slash-dx11` in their profile.
[Preset: arguments-slash-dx11]
# AirMech Strike (reported on Linux, umu-protonfixes)
steam-app = 206500
add-arguments = /dx11
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
