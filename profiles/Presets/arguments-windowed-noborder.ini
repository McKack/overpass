# Preset arguments-windowed-noborder: starts with -windowed -noborder.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-windowed-noborder` in their profile.
[Preset: arguments-windowed-noborder]
# Left 4 Dead (reported on Highball: fullscreen fails to create its device)
steam-app = 500
add-arguments = -windowed -noborder
source = Community reports in Highball's open database (CC0)
