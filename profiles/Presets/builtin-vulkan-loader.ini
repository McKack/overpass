# Preset builtin-vulkan-loader: Wine's Vulkan loader instead of the one the game ships.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = builtin-vulkan-loader` in their profile.
[Preset: builtin-vulkan-loader]
# Ship Graveyard Simulator (reported on Linux, umu-protonfixes)
steam-app = 1286880
# Ship Graveyard Simulator Prologue (reported on Linux, umu-protonfixes)
steam-app = 1664350
dll = vulkan-1=b
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
