# Preset chromium-in-process-gpu: Chromium (CEF) switches: --in-process-gpu.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-in-process-gpu` in their profile.
[Preset: chromium-in-process-gpu]
program = Foxmail.exe
program = HYP.exe
program = tdxw.exe
program = Tools\Launcher.exe
program = WXWorkWeb.exe
# Vindictus (reported on Highball)
steam-app = 212160
add-arguments = --in-process-gpu
unless-argument = --type=crashpad-handler
source = Known per-game settings for Wine on macOS
