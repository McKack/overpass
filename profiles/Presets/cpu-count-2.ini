# Preset cpu-count-2: the program sees 2 processors.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = cpu-count-2` in their profile.
[Preset: cpu-count-2]
# Death end re;Quest (reported on Linux, umu-protonfixes)
steam-app = 990050
env = WINENCPU=2
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
