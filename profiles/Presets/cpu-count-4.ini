# Preset cpu-count-4: the program sees 4 processors.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = cpu-count-4` in their profile.
[Preset: cpu-count-4]
# LEGO Marvel Super Heroes 2 (reported on Linux, umu-protonfixes)
steam-app = 647830
env = WINENCPU=4
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
