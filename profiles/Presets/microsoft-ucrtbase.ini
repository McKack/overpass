# Preset microsoft-ucrtbase: Microsoft's Universal C Runtime before Wine's.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = microsoft-ucrtbase` in their profile.
[Preset: microsoft-ucrtbase]
# Age of Empires II: Definitive Edition
steam-app = 813780
# Age of Empires III: Definitive Edition
steam-app = 933110
# Tempest Rising
steam-app = 1486920
dll = ucrtbase=n,b
source = Known per-game settings for Wine on macOS
