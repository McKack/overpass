# Preset no-dcomp: DirectComposition stays off, for a game stuck on a white screen.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = no-dcomp` in their profile.
[Preset: no-dcomp]
# Shadows of Adam (reported on Linux, umu-protonfixes)
steam-app = 506510
dll = dcomp=d
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
