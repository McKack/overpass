# Preset no-libglesv2: the game's own libGLESv2 stays off, so its Chromium pages draw without the GPU.
# The games listed were fixed this way under Wine on Linux; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = no-libglesv2` in their profile.
[Preset: no-libglesv2]
# Dungeons & Dragons Online (reported on Linux, umu-protonfixes)
steam-app = 206480
# The Lord of the Rings Online (reported on Linux, umu-protonfixes)
steam-app = 212500
# Zero Escape: Zero Time Dilemma (reported on Linux, umu-protonfixes)
steam-app = 311240
dll = libglesv2=d
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
