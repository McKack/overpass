# Preset steam-deck: the game is told it runs on a Steam Deck.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = steam-deck` in their profile.
[Preset: steam-deck]
# God of War Ragnarök
steam-app = 2322010
env = SteamDeck=1
source = Known per-game settings for Wine on macOS
