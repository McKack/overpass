# A known fix: Avowed's launcher step GamingRepair isn't needed under Wine, so a program that does nothing
# starts in its place. Needs OverPass Wine 11.0-14 or newer; older builds start GamingRepair as before.
# Untested here.
[Avowed: skip GamingRepair]
program = Avowed\GamingRepair\GamingRepair.exe
replace-path = \Avowed\GamingRepair\GamingRepair.exe => C:\windows\system32\donothing.exe
source = A known fix for Avowed under Wine on macOS
