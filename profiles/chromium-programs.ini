# Programs that draw their windows with Chromium (CEF, Chrome, Edge WebView2) start a separate GPU
# process, which can't draw into the browser process's windows under Wine on macOS: they stay blank.
# Keeping the GPU work in the browser process fixes that. Launchers with their own rule (Steam, GOG
# Galaxy, EA, Epic...) get it from there; this covers the rest, such as game launchers and in-game
# browsers. Child processes (--type=...) are left alone.
[Chromium programs: GPU in the browser process]
beside = libcef.dll
beside = chrome_elf.dll
beside = msedge_elf.dll
add-arguments = --in-process-gpu
unless-argument = --type=
source = Launcher rules in these profiles (Steam, EA, Ubisoft, Battle.net, Rockstar, Epic); MetalSharp-Wine's notes on CEF browsers
