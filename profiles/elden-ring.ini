# Steam starts ELDEN RING through start_protected_game.exe, Easy Anti-Cheat's starter, which doesn't
# work under Wine. Start the game itself: it then runs offline only, without online play.
[ELDEN RING: start without Easy Anti-Cheat]
steam-app = 1245620
replace-path = \ELDEN RING\Game\start_protected_game.exe => \ELDEN RING\Game\eldenring.exe
source = A known fix for ELDEN RING under Wine on macOS

[anti-cheat]
game = Elden Ring
uses = Easy Anti-Cheat
status = Supported
