[store]
steam = 1593500

# White specks on characters, Kratos first, in dim light: the game draws a depth prepass and then the same geometry
# with a depth test of "equal", and Metal doesn't compute the two depths to the same last bit. "Greater or equal"
# removes every speck (found by a r/macgaming poster, measured by MacGameFix on DXMT). Something drawn in front of a
# character after the prepass could show through. Untested on OverPass.
[God of War: white specks]
steam-app = 1593500
program = GoW.exe
tweak = depth-equal
source = MacGameFix (GPL-3.0), legacy/wiki/God-of-War.md
