# A known fix: start The Witcher 3's DirectX 11 build when the DirectX 12 one is asked for. Why is not
# recorded; untested here.
[The Witcher 3: DirectX 11 build]
program = bin\x64_dx12\witcher3.exe
replace-path = \bin\x64_dx12\witcher3.exe => \bin\x64\witcher3.exe
source = A known fix for The Witcher 3 under Wine on macOS

[store]
steam = 292030
gog = 1640424747
link = https://www.gog.com/en/game/the_witcher_3_wild_hunt_game_of_the_year_edition

# The 5.0 update looks for wine_get_version, and when it finds it never starts NVIDIA Streamline (DLSS, Reflex) and
# turns ray tracing and frame generation off. Reported on Linux (umu-protonfixes) and on D3DMetal (MacGameFix).
# Untested on OverPass.
[The Witcher 3: hide Wine]
steam-app = 292030
program = bin\x64_dx12\witcher3.exe
tweak = hide-wine
source = umu-protonfixes (BSD-2-Clause), fixes for Proton on Linux
