[store]
steam = 2464280

# Crashes before the first frame (access violation at 0xfffffffffffffff8) on a display with no 16:9 resolutions,
# such as a MacBook's: the game keeps only 16:9 modes and has no fallback when none are left. Found by MacGameFix.
# Untested on OverPass.
[Tormented Souls 2: 16:9 resolutions]
steam-app = 2464280
tweak = add-16-9-modes
source = MacGameFix (GPL-3.0), legacy/wiki/Tormented-Souls-2.md
