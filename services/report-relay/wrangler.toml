# Arctim report relay (see src/index.js), at reports.arctim.no. Deploy: npx wrangler deploy
# The GitHub App's ID and private key are secrets, never in this file:
#   npx wrangler secret put APP_ID
#   npx wrangler secret put APP_PRIVATE_KEY   (PKCS#8 PEM)
name = "reports"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "reports.arctim.no", custom_domain = true }]

# Starts sync-games.yml; the GitHub App needs Actions: write for it.
[triggers]
crons = ["*/30 * * * *"]

[vars]
# Each app's path and the repository its reports go to.
APPS = '{"overpass": "McKack/overpass"}'
HOURLY_LIMIT = "5"
# Where a rating is shown: <site>/games/<id>.
SITES = '{"overpass": "https://overpass.arctim.no"}'

[[kv_namespaces]]
binding = "REPORTS"
id = "dbc4f9b06aa8464ba81e317cb102b906"

# The games database, shared with the site (../site/schema.sql). Ratings go here, not to GitHub.
[[d1_databases]]
binding = "GAMES"
database_name = "overpass-games"
database_id = "116449a1-9ec7-438c-a3a9-2f2df5a342b3"
