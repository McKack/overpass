# overpass.arctim.no: the landing page in ../../site as static files, and the game pages from src/index.js.
# Deploy: npx wrangler deploy (from this folder). The install script is served at /install.
# Secrets: SYNC_TOKEN, also the repository secret GAMES_SYNC_TOKEN (sync-games.yml sends the list of games with it);
# GOOGLE_CLIENT_SECRET, the secret of the web client below.
name = "overpass-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [{ pattern = "overpass.arctim.no", custom_domain = true }]

[assets]
directory = "../../site"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*", "/games", "/games/*", "/auth/*", "/account", "/account/*", "/moderation", "/moderation/*", "/pictures/*", "/privacy", "/report/*"]

[vars]
# Google Cloud project named-berm-513401-i3, web client "OverPass site". The redirect URI there is
# https://overpass.arctim.no/auth/google/callback.
GOOGLE_CLIENT_ID = "17484810858-687cnl3es1se4v9tn8evvcsr34kvuc6n.apps.googleusercontent.com"
REPORT_RELAY = "https://reports.arctim.no/overpass"

# The report relay: a report finished on /report/<ticket> goes out through it.
[[services]]
binding = "RELAY"
service = "reports"

# People's pictures. Stays out of the static site's way: /pictures/* above.
[[kv_namespaces]]
binding = "PICTURES"
id = "498de0440dd94cf4b78906fc8e203437"

[[d1_databases]]
binding = "DB"
database_name = "overpass-games"
database_id = "116449a1-9ec7-438c-a3a9-2f2df5a342b3"
