; OverPass's own additions to SteamDB's rules.ini, in the same format.
; [Presets] says which preset a detected engine or SDK gets. Keep to settings that are harmless when they don't apply,
; and to what has been measured: engines alone predict little (PLAN.md, Detection findings).

[Engine]
CreationEngine[] = (?:^|/)Data/Skyrim\.esm$
CreationEngine[] = (?:^|/)Data/[^/]+\.ba2$

[Presets]
Engine.CreationEngine = microsoft-xaudio2
