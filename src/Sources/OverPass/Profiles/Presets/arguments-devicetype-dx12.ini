# Preset arguments-devicetype-dx12: starts with /devicetype DX12.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-devicetype-dx12` in their profile.
[Preset: arguments-devicetype-dx12]
program = Anno1800.exe
add-arguments = /devicetype DX12
source = Known per-game settings for Wine on macOS
