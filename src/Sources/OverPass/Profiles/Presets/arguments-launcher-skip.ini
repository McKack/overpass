# Preset arguments-launcher-skip: starts with --launcher-skip.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-launcher-skip` in their profile.
[Preset: arguments-launcher-skip]
program = redprelauncher.exe
add-arguments = --launcher-skip
source = Known per-game settings for Wine on macOS
