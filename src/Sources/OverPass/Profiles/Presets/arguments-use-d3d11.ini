# Preset arguments-use-d3d11: starts with --use-d3d11.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-use-d3d11` in their profile.
[Preset: arguments-use-d3d11]
program = helldivers2.exe
add-arguments = --use-d3d11
source = Known per-game settings for Wine on macOS
