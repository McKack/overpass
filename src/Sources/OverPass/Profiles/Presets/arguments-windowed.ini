# Preset arguments-windowed: starts with -windowed.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = arguments-windowed` in their profile.
[Preset: arguments-windowed]
# MindsEye
steam-app = 3265250
add-arguments = -windowed
source = Known per-game settings for Wine on macOS
