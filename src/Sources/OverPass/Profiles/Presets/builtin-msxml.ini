# Preset builtin-msxml: Wine's own MSXML 2 and 3 before the program's.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = builtin-msxml` in their profile.
[Preset: builtin-msxml]
program = EAappInstaller.exe
program = vc_redist-11.0.61030.x86.exe
program = vc_redist-12.0.40664.x86.exe
program = vc_redist.x64.exe
program = vc_redist.x86.exe
dll = msxml2=b,n
dll = msxml3=b,n
source = CrossOver 26's per-game settings (which games need these settings)
