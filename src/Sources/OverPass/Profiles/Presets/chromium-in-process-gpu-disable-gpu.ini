# Preset chromium-in-process-gpu-disable-gpu: Chromium (CEF) switches: --in-process-gpu --disable-gpu.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-in-process-gpu-disable-gpu` in their profile.
[Preset: chromium-in-process-gpu-disable-gpu]
program = LootHoarder.exe
program = webview_support_browser.exe
add-arguments = --in-process-gpu --disable-gpu
unless-argument = --type=crashpad-handler
source = CrossOver 26's per-game settings (which games need these settings)
