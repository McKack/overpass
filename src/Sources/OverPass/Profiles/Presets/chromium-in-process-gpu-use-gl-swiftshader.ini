# Preset chromium-in-process-gpu-use-gl-swiftshader: Chromium (CEF) switches: --in-process-gpu --use-gl=swiftshader.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-in-process-gpu-use-gl-swiftshader` in their profile.
[Preset: chromium-in-process-gpu-use-gl-swiftshader]
program = qwSubprocess.exe
add-arguments = --in-process-gpu --use-gl=swiftshader
unless-argument = --type=crashpad-handler
source = Known per-game settings for Wine on macOS
