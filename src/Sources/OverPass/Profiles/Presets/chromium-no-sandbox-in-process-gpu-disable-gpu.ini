# Preset chromium-no-sandbox-in-process-gpu-disable-gpu: Chromium (CEF) switches: --no-sandbox --in-process-gpu --disable-gpu.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-no-sandbox-in-process-gpu-disable-gpu` in their profile.
[Preset: chromium-no-sandbox-in-process-gpu-disable-gpu]
program = Paradox Launcher.exe
program = r2modman.exe
add-arguments = --no-sandbox --in-process-gpu --disable-gpu
unless-argument = --type=crashpad-handler
source = CrossOver 26's per-game settings (which games need these settings)
