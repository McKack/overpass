# Preset chromium-no-sandbox-in-process-gpu-use-gl-swiftshader: Chromium (CEF) switches: --no-sandbox --in-process-gpu --use-gl=swiftshader.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-no-sandbox-in-process-gpu-use-gl-swiftshader` in their profile.
[Preset: chromium-no-sandbox-in-process-gpu-use-gl-swiftshader]
program = msedgewebview2.exe
program = t2gp.exe
add-arguments = --no-sandbox --in-process-gpu --use-gl=swiftshader
unless-argument = --type=crashpad-handler
source = CrossOver 26's per-game settings (which games need these settings)
