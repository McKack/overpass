# Preset chromium-no-sandbox-in-process-gpu: Chromium (CEF) switches: --no-sandbox --in-process-gpu.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = chromium-no-sandbox-in-process-gpu` in their profile.
[Preset: chromium-no-sandbox-in-process-gpu]
program = Homicipher.exe
add-arguments = --no-sandbox --in-process-gpu
unless-argument = --type=crashpad-handler
source = Known per-game settings for Wine on macOS
