# Preset cpu-count-10: the program sees 10 processors.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = cpu-count-10` in their profile.
[Preset: cpu-count-10]
program = Cyberpunk2077.exe
env = WINENCPU=10
source = Known per-game settings for Wine on macOS
