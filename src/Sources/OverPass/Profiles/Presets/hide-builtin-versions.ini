# Preset hide-builtin-versions: Wine's own DLLs show no version resources, as if missing.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = hide-builtin-versions` in their profile.
[Preset: hide-builtin-versions]
program = vc_redist.x64.exe
program = vc_redist.x86.exe
program = vcredist_x64.exe
program = vcredist_x86.exe
env = CX_HIDE_BUILTIN_VERSION_RESOURCES=1
source = Known per-game settings for Wine on macOS
