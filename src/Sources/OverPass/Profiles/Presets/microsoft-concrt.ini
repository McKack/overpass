# Preset microsoft-concrt: Microsoft's Concurrency Runtime before Wine's.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = microsoft-concrt` in their profile.
[Preset: microsoft-concrt]
program = MCC-Win64-Shipping.exe
dll = concrt140=n,b
source = CrossOver 26's per-game settings (which games need these settings)
