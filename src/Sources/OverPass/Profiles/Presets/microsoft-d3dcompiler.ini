# Battlefield™ 1
steam-app = 1238840
# Battlefield™ V
steam-app = 1238810
# Mass Effect™ Legendary Edition
steam-app = 1328670
# METAL GEAR SOLID - Master Collection Version
steam-app = 2131630
# Star Hunter - Infinite Lagrange
steam-app = 1755920
# The Sims™ 4
steam-app = 1222670
# Titanfall® 2
steam-app = 1237970
dll = d3dcompiler_47=n,b
source = CrossOver 26's per-game settings (which games need these settings)
