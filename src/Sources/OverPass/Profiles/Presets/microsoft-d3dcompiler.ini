# Preset microsoft-d3dcompiler: Microsoft's d3dcompiler_47 (from the runtime installers) before Wine's.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = microsoft-d3dcompiler` in their profile.
[Preset: microsoft-d3dcompiler]
program = starwarsjedifallenorder.exe
program = SwGame-Win64-Shipping.exe
