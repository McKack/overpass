# Preset microsoft-xaudio2: Microsoft's XAudio2 2.6/2.7 and X3DAudio before Wine's.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = microsoft-xaudio2` in their profile.
[Preset: microsoft-xaudio2]
program = Fallout4.exe
program = SkyrimSE.exe
# Banished
steam-app = 242920
# Fallout 4
steam-app = 377160
# Fallout 76
steam-app = 1151340
# The Elder Scrolls V: Skyrim
steam-app = 72850
# The Elder Scrolls V: Skyrim Special Edition
steam-app = 489830
dll = x3daudio1_6=n,b
dll = x3daudio1_7=n,b
dll = xaudio2_6=n,b
dll = xaudio2_7=n,b
source = Known per-game settings for Wine on macOS
