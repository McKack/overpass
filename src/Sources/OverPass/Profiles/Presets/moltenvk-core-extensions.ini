# Preset moltenvk-core-extensions: MoltenVK advertises only core Vulkan extensions.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = moltenvk-core-extensions` in their profile.
[Preset: moltenvk-core-extensions]
program = PathOfExile.exe
# Path of Exile
steam-app = 238960
# Path of Exile 2
steam-app = 2694490
env = MVK_CONFIG_ADVERTISE_EXTENSIONS=0
source = CrossOver 26's per-game settings (which games need these settings)
