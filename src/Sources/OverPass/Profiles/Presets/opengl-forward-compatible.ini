# Preset opengl-forward-compatible: OpenGL contexts are forward-compatible core profiles.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = opengl-forward-compatible` in their profile.
[Preset: opengl-forward-compatible]
program = KnightsProvince.exe
program = srx.exe
program = tomb123.exe
program = tomb456.exe
# Mewgenics
steam-app = 686060
env = CX_FWD_COMPAT_GL_CTX=1
source = CrossOver 26's per-game settings (which games need these settings)
