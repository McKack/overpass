# Preset simulate-writecopy: executable images get copy-on-write pages, as on Windows.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = simulate-writecopy` in their profile.
[Preset: simulate-writecopy]
program = WeChatAppEx.exe
program = WeMail.exe
program = WXWorkWeb.exe
env = WINE_SIMULATE_WRITECOPY=1
source = CrossOver 26's per-game settings (which games need these settings)
