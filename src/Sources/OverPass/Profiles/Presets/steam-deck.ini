# Preset steam-deck: the game is told it runs on a Steam Deck.
# The games listed are the ones CrossOver 26 gives these settings; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = steam-deck` in their profile.
[Preset: steam-deck]
# God of War Ragnarök
steam-app = 2322010
env = SteamDeck=1
source = CrossOver 26's per-game settings (which games need these settings)
