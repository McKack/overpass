# Preset wined3d: WineD3D when the container is on Automatic.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = wined3d` in their profile.
[Preset: wined3d]
# Fruit Stand Fortune
steam-app = 3306030
# Tower Wizard
steam-app = 3372980
prefer-graphics = wined3d
source = Known per-game settings for Wine on macOS
