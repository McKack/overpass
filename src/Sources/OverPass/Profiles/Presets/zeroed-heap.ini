# Preset zeroed-heap: heap allocations start zeroed.
# The games listed are ones known to need these settings under Wine on macOS; untested on OverPass unless a game's
# own profile says so. Other games can use the preset with `preset = zeroed-heap` in their profile.
[Preset: zeroed-heap]
program = helldivers2.exe
env = WINE_HEAP_ZERO_MEMORY=1
source = Known per-game settings for Wine on macOS
