# Steam starts ARMORED CORE VI through Easy Anti-Cheat's starter, which doesn't work under Wine. Start
# the game itself: it then runs offline only.
[ARMORED CORE VI: start without Easy Anti-Cheat]
steam-app = 1888160
replace-path = \ARMORED CORE VI FIRES OF RUBICON\Game\start_protected_game.exe => \ARMORED CORE VI FIRES OF RUBICON\Game\armoredcore6.exe
source = A known fix for ARMORED CORE VI under Wine on macOS
