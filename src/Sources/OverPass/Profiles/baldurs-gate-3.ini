# A known fix: skip Baldur's Gate 3's Larian launcher and start the DirectX 11 game directly. Why the
# launcher fails is not recorded; untested here.
[Baldur's Gate 3: skip the Larian launcher]
program = Baldurs Gate 3\Launcher\LariLauncher.exe
replace-path = \Baldurs Gate 3\Launcher\LariLauncher.exe => \Baldurs Gate 3\bin\bg3_dx11.exe
source = A known fix for Baldur's Gate 3 under Wine on macOS
