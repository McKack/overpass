[app]
name = Battle.net
category = Game Launcher
featured = 5
brand-color = 4381C3
rating = untested
bottle = windows10
bottle-group = battle-net
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
dll = systemsurvey.exe=d
notes = Games installed through Battle.net share this bottle.

[install]
download = https://downloader.battle.net/download/getInstallerForGame?os=win&gameProgram=BATTLENET_APP&version=Live
download-page = https://download.battle.net/
file = Battle.net-Setup*.exe
wait-ignore = Agent.exe

[launch]
executable = C:\Program Files (x86)\Battle.net\Battle.net Launcher.exe

# Battle.net's interface is Chromium (CEF): render it in software inside the main process. The client
# also relies on Windows copy-on-write behaviour for its mapped files and on more than 2 GB of
# address space, which Wine provides when asked.
[Battle.net: software rendering and memory behaviour]
program = Battle.net.exe
add-arguments = --in-process-gpu --use-gl=swiftshader
env = WINE_SIMULATE_WRITECOPY=1
env = WINE_LARGE_ADDRESS_AWARE=1
source = Informed by CrossOver 26's handling of Battle.net (Bugs 19610, 23072, 26203)
