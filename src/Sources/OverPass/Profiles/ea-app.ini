[app]
name = EA
category = Game Launcher
featured = 4
brand-color = 000000
rating = untested
bottle = windows10
bottle-group = ea
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
notes = Games installed through the EA app share this bottle.

[install]
download = https://origin-a.akamaihd.net/EA-Desktop-Client-Download/installer-releases/EADesktopInstaller.exe
download-page = https://www.ea.com/ea-app
file = EADesktopInstaller*.exe
file = EAappInstaller*.exe

[launch]
executable = C:\Program Files\Electronic Arts\EA Desktop\EA Desktop\EADesktop.exe

# The EA app mixes Chromium (Qt WebEngine) and Qt Quick. Chromium needs its GPU work done in-process
# through ANGLE, and Qt Quick needs its software renderer, or the window stays empty.
# Link2EA.exe is how Steam starts EA games, and it brings up the same interface.
[EA app: in-process ANGLE and software Qt Quick]
program = EADesktop.exe
program = Link2EA.exe
add-arguments = --in-process-gpu --use-gl=angle
env = QMLSCENE_DEVICE=softwarecontext
source = Informed by CrossOver 26's handling of the EA app (Bugs 25629, 25499)
