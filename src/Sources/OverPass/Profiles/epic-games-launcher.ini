[app]
name = Epic Games
category = Game Launcher
featured = 2
brand-color = 313131
rating = untested
bottle = windows10
bottle-group = epic-games
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
notes = Games installed through the Epic Games Launcher share this container.

[install]
download = https://launcher-public-service-prod06.ol.epicgames.com/launcher/api/installer/download/EpicGamesLauncherInstaller.msi
download-page = https://store.epicgames.com/download
file = EpicGamesLauncherInstaller*.msi
file = EpicInstaller-*.msi
silent = /qn

[launch]
executable = C:\Program Files (x86)\Epic Games\Launcher\Portal\Binaries\Win64\EpicGamesLauncher.exe

# The Epic Games Launcher and its Epic Online Services overlay are Chromium (CEF). Their separate GPU
# process fails under Wine on macOS; rendering through ANGLE inside the main process works.
[Epic Games: in-process ANGLE rendering]
program = EpicGamesLauncher.exe
program = EpicOnlineServicesUIHelper.exe
program = EOSOverlayRenderer-Win64-Shipping.exe
program = EOSOverlayRenderer-Win32-Shipping.exe
add-arguments = --in-process-gpu --use-gl=angle
unless-argument = --type=crashpad-handler
source = A known fix for the Epic Games Launcher under Wine on macOS
