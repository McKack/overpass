[app]
name = GOG
category = Game Launcher
featured = 3
brand-color = 86328A
rating = untested
bottle = windows10
bottle-group = gog
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
dll = GalaxyOverlay.exe=d
notes = GOG offline installers (setup_*.exe) can also be installed directly without Galaxy.
source = GOG's current Galaxy installer (the link its web installer reads) | https://remote-config.gog.com/components/webinstaller?component_version=2.0.0
source = winget manifest: GOG.Galaxy is an Inno Setup installer | https://github.com/microsoft/winget-pkgs/tree/master/manifests/g/GOG/Galaxy

[install]
latest-link = https://remote-config.gog.com/components/webinstaller?component_version=2.0.0 content.windows.downloadLink
download-page = https://www.gog.com/galaxy
file = setup_galaxy_*.exe
silent = /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
wait-ignore = GalaxyClient.exe

[launch]
executable = C:\Program Files\GOG Galaxy\GalaxyClient.exe
stale-file = C:\ProgramData\GOG.com\Galaxy\lock-files\*.lock
# Closing the window quits Galaxy, as Mac apps do; on Windows it would keep running in the system tray.
json-setting = C:\users\overpass\AppData\Local\GOG.com\Galaxy\Configuration\config.json | whenClosingMainWindow | exitGalaxy

# GOG Galaxy draws its interface with Chromium (118, in Qt WebEngine) through Direct3D 11. Wine's own Direct3D
# gives it an invalid surface format and it aborts a few seconds after start. OverPass Runtime renders it,
# GPU process included, so no software-rendering switches are needed. Without OverPass Runtime installed the
# rule changes nothing.
[GOG Galaxy: OverPass Runtime]
program = GalaxyClient.exe
program = GalaxyClient Helper.exe
program = GOG Galaxy Notifications Renderer.exe
graphics = dxmt
source = Tested 2026-10-25 with Galaxy 2.1.10.56: wined3d crashes (skia_output_surface_impl); OverPass Runtime (from patch 0002 on) shows the login window, also without software rendering

# Galaxy draws its own title bar and window buttons. Without this, OverPass Wine adds a Mac title bar on
# top that covers Galaxy's own (needs OverPass Wine 11.0-4 or later; older builds ignore the variable).
[GOG Galaxy: own window frame]
program = GalaxyClient.exe
env = OVERPASS_NO_MAC_FRAME=1
source = Seen 2026-10-26: the main window shows a Mac title bar over Galaxy's own
