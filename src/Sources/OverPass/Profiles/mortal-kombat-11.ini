notes = MacGameFix's mk11-fix fix: Bare faces -- forehead, brows, around the eyes -- turn into smeared dark patches with hard edges that follow the light and change from frame to frame. Clean right after a screen loads, broken once the face animates; barely visible in a fight, glaring in close views, the character select and the fatalities. Masked fighters never show it. It has been there since at least an M1 Pro. Applied when it runs on any graphics backend.
