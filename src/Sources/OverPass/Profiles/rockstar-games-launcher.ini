[app]
name = Rockstar Games
category = Game Launcher
featured = 6
brand-color = FCAF17
rating = untested
bottle = windows10
bottle-group = rockstar
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
notes = Games installed through the Rockstar Games Launcher share this container.

[install]
download = https://gamedownloads.rockstargames.com/public/installer/Rockstar-Games-Launcher.exe
download-page = https://www.rockstargames.com/downloads
file = Rockstar-Games-Launcher*.exe
wait-ignore = Launcher.exe

[launch]
executable = C:\Program Files\Rockstar Games\Launcher\Launcher.exe

# The Rockstar Games Launcher draws its window with Direct3D, which only works on Wine's own wined3d.
[Rockstar Games Launcher: wined3d]
program = Rockstar Games\Launcher\Launcher.exe
graphics = wined3d
source = A known fix for the Rockstar Games Launcher under Wine on macOS

# Its Social Club sign-in is Chromium (CEF): render through ANGLE's software backend, in-process.
[Rockstar Games Launcher: Social Club in software]
program = SocialClubHelper.exe
add-arguments = --in-process-gpu --use-gl=angle --use-angle=swiftshader
source = A known fix for the Rockstar Games Launcher under Wine on macOS
