[app]
name = Steam
category = Game Launcher
featured = 1
brand-color = 000000
rating = untested
bottle = windows10
bottle-group = steam
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
notes = Steam requires Windows 10 or later. Games installed through Steam share this bottle.
source = Steam system requirements | https://store.steampowered.com/about/

[install]
download = https://cdn.cloudflare.steamstatic.com/client/installer/SteamSetup.exe
download-page = https://store.steampowered.com/about/
file = SteamSetup*.exe
silent = /S
wait-ignore = steam.exe

[launch]
executable = C:\Program Files (x86)\Steam\steam.exe

# Steam draws its store, library and overlay with Chromium (steamwebhelper.exe). Chromium's sandbox and
# separate GPU process don't work under Wine on macOS, which leaves the window black or blank.
[Steam: web helper without sandbox or GPU process]
program = steamwebhelper.exe
add-arguments = --no-sandbox --in-process-gpu --disable-gpu
unless-argument = --type=crashpad-handler
source = Informed by CrossOver 26's handling of Steam (Hack 13322)
