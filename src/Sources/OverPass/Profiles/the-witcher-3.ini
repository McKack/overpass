[app]
name = The Witcher 3: Wild Hunt
category = Games
rating = untested
steam-app = 292030
fix = w3-fix d3dmetal
notes = MacGameFix's w3-fix fix (DirectX 12 build): refuses the stream-output pipeline that crashes D3DMetal's shader converter, and lets the game offer DLSS. Applied when it runs on D3DMetal; the game's own files are put back on any other backend.
source = MacGameFix (GPL-3.0), install-w3-fix.sh | https://github.com/MathiasKowoll/MacGameFix/tree/main/fixes
source = Steam app ID | https://store.steampowered.com/app/292030/

# CrossOver starts The Witcher 3's DirectX 11 build when the DirectX 12 one is asked for. Why is not
# recorded; untested here.
[The Witcher 3: DirectX 11 build]
program = bin\x64_dx12\witcher3.exe
replace-path = \bin\x64_dx12\witcher3.exe => \bin\x64\witcher3.exe
source = Informed by CrossOver 26's handling of The Witcher 3 (Hacks 21786, 24153)
