# A known fix: start The Witcher 3's DirectX 11 build when the DirectX 12 one is asked for. Why is not
# recorded; untested here.
[The Witcher 3: DirectX 11 build]
program = bin\x64_dx12\witcher3.exe
replace-path = \bin\x64_dx12\witcher3.exe => \bin\x64\witcher3.exe
source = A known fix for The Witcher 3 under Wine on macOS
