[app]
name = Ubisoft
category = Game Launcher
featured = 7
brand-color = 000000
rating = untested
bottle = windows10
bottle-group = ubisoft
runtime = vcrun
runtime = corefonts
runtime = d3dcompiler_47
runtime = cjkfonts
notes = Games installed through Ubisoft Connect share this container.

[install]
download = https://static3.cdn.ubi.com/orbit/launcher_installer/UbisoftConnectInstaller.exe
download-page = https://www.ubisoft.com/en-us/ubisoft-connect/download
file = UbisoftConnectInstaller*.exe

[launch]
executable = C:\Program Files (x86)\Ubisoft\Ubisoft Game Launcher\UbisoftConnect.exe

# Ubisoft Connect (upc.exe) and its web view (UplayWebCore.exe) are Chromium (CEF). Without the sandbox
# and GPU process turned off, the window stays blank under Wine on macOS.
[Ubisoft Connect: no sandbox or GPU process]
program = upc.exe
program = UplayWebCore.exe
add-arguments = --no-sandbox --in-process-gpu --disable-gpu
source = A known fix for Ubisoft Connect under Wine on macOS
